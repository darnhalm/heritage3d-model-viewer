name: Benchmark tile streaming

# Ручной внешний benchmark опубликованного viewer. В production-бандл режим не добавляется:
# Playwright открывает обычный плеер и читает только уже существующую диагностику.
on:
  workflow_dispatch:
    inputs:
      network:
        description: Network profile
        required: true
        default: native
        type: choice
        options:
          - native
          - broadband
          - fast3g
      passes:
        description: Browser cache passes
        required: true
        default: cold,warm
        type: choice
        options:
          - cold,warm
          - cold
      runs:
        description: Repetitions per scene and variant
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '3'
          - '5'
      step_ms:
        description: Milliseconds at each camera waypoint
        required: true
        default: '2500'
        type: choice
        options:
          - '1500'
          - '2500'
          - '5000'
      screenshots:
        description: Capture every camera waypoint
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: benchmark-tile-streaming
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Benchmark production tile streaming
        env:
          BENCH_URL: https://playcanvasviewer.website.yandexcloud.net/
          BENCH_TILE_SUITE: production
          BENCH_NETWORK: ${{ inputs.network }}
          BENCH_TILE_PASSES: ${{ inputs.passes }}
          BENCH_RUNS: ${{ inputs.runs }}
          BENCH_STEP_MS: ${{ inputs.step_ms }}
          BENCH_SCREENSHOTS: ${{ inputs.screenshots && '1' || '0' }}
          BENCH_HEADLESS: '1'
          BENCH_OUTPUT: benchmark-results
        run: node scripts/benchmark-tiles.mjs

      # Репозиторий публичный: артефакт содержит только метрики публичных сцен, без URL с
      # query string, cookies, заголовков авторизации и содержимого пользовательских моделей.
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tile-benchmark-${{ github.run_id }}
          path: benchmark-results
          if-no-files-found: warn
          retention-days: 14
